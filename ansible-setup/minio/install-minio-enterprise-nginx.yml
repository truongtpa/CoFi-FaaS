- name: Install Docker and Docker Compose
  hosts: minio
  become: yes
  vars:
    minio_root_user: admin
    minio_root_password: lannion-enssat

    # Options: "ramdisk" or "disk"
    minio_storage_type: ramdisk
    minio_ramdisk_mount: /data/minio
    minio_ramdisk_size: 240G

     # Used when storage_type = "disk"
    minio_disk_path: /data/minio

  tasks:
    - name: Create minio directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/minio"
        state: directory
        mode: '0755'

    - name: Remove minio.license if it is a directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/minio/minio.license"
        state: absent

    - name: Write license file
      ansible.builtin.copy:
        content: "eyJhbGciOiJFUzM4NCIsInR5cCI6IkpXVCJ9..YvD6cL5rQuQgfDPDFUaFAMT8GI6xvBIUNZDsVpXL7P01DhbFlwj_qnwSP8qKl0crWuY3wQhNcttvYKvV4BMWDHXvJx9mPJ2K0DtnfzGcvKk_NsyXJk8RJ41Hvur8nBjs"
        dest: "{{ ansible_env.HOME }}/minio/minio.license"

    - name: Remove existing MinIO AIStor container
      community.docker.docker_container:
        name: aistor-server
        state: absent


    - name: Mount tmpfs for MinIO (RAM disk)
      mount:
        path: "{{ minio_ramdisk_mount }}"
        src: tmpfs
        fstype: tmpfs
        opts: "size={{ minio_ramdisk_size }},noatime,nosuid,nodev,mode=0755"
        state: mounted
      when: minio_storage_type == "ramdisk"

    - name: Ensure tmpfs is persistent across reboots
      mount:
        path: "{{ minio_ramdisk_mount }}"
        src: tmpfs
        fstype: tmpfs
        opts: "size={{ minio_ramdisk_size }},noatime,nosuid,nodev,mode=0755"
        state: present
      when: minio_storage_type == "ramdisk"


    - name: Create MinIO data directory on disk
      ansible.builtin.file:
        path: "{{ minio_disk_path }}"
        state: directory
        mode: '0755'
      when: minio_storage_type == "disk"


    - name: Set minio_data_path fact
      ansible.builtin.set_fact:
        minio_data_path: "{{ minio_ramdisk_mount if minio_storage_type == 'ramdisk' else minio_disk_path }}"

    - name: Fix ownership for MinIO data directory
      file:
        path: "{{ minio_data_path }}"
        owner: root
        group: root
        mode: '0755'
        recurse: yes

    - name: Run MinIO AIStor container
      community.docker.docker_container:
        name: aistor-server
        image: quay.io/minio/aistor/minio:latest
        state: started
        restart_policy: unless-stopped
        detach: true
        tty: true
        ports:
          - "9000:9000"
          - "9001:9001"
        env:
          MINIO_ROOT_USER: "{{ minio_root_user }}"
          MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
        volumes:
          - "{{ minio_data_path }}:/mnt/data"
          - "{{ ansible_env.HOME }}/minio/minio.license:/minio.license"
          - "{{ ansible_env.HOME }}/minio/certs:/etc/minio/certs"
        command: "minio server /mnt/data --license /minio.license"

    # ── Nginx ──────────────────────────────────────────────────────────────────

    - name: Create nginx config directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/nginx"
        state: directory
        mode: '0755'

    - name: Copy nginx.conf to remote host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/nginx-config/nginx-v2.conf"
        dest: "{{ ansible_env.HOME }}/nginx/nginx.conf"
        mode: "0644"
      notify: Restart nginx container

    - name: Pull Nginx Docker image
      community.docker.docker_image:
        name: nginx:latest
        source: pull

    - name: Run Nginx reverse proxy container
      community.docker.docker_container:
        name: nginx-proxy
        image: nginx:latest
        state: started
        restart_policy: unless-stopped
        ports:
          - "8000:8000"
        etc_hosts:
          host.docker.internal: host-gateway
        volumes:
          - "{{ ansible_env.HOME }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"

  handlers:
    - name: Restart nginx container
      community.docker.docker_container:
        name: nginx-proxy
        state: started
        restdocker stats aistor-server --no-streamart: true