worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time bs=$bytes_sent';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    set_real_ip_from  10.244.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone  $binary_remote_addr zone=s3_read:10m  rate=5500r/s;
    limit_conn_zone $binary_remote_addr zone=s3_conn:10m;
    limit_req_status  503;
    limit_conn_status 503;

    keepalive_timeout  65;
    keepalive_requests 10000;

    upstream minio_api {
        server host.docker.internal:9000;
        keepalive 512;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }

    server {
        listen 8000 reuseport;
        server_name _;

        client_max_body_size 0;
        limit_conn s3_conn 500;

        location / {
            limit_req zone=s3_read burst=1000 nodelay;
            limit_rate 78643200;

            proxy_pass         http://minio_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering            on;
            proxy_buffer_size          256k;
            proxy_buffers              64 256k;
            proxy_busy_buffers_size    512k;
            proxy_temp_file_write_size 512k;
            proxy_max_temp_file_size   0;
            proxy_request_buffering    off;
            proxy_connect_timeout      10s;
            proxy_send_timeout         300s;
            proxy_read_timeout         300s;
        }

        error_page 503 @slowdown;
        location @slowdown {
            default_type application/xml;
            return 503 '<?xml version="1.0" encoding="UTF-8"?><Error><Code>SlowDown</Code></Error>';
        }
    }
}