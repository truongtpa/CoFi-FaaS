---
# Master Playbook - Run all infrastructure setup playbooks
# Usage: ansible-playbook run-all.yml
#        ansible-playbook run-all.yml --tags k8s
#        ansible-playbook run-all.yml --skip-tags monitoring,nfs,docker

- name: "[k8s-ansible] Run site.yml"
  tags: [k8s, always_k8s]
  import_playbook: k8s-ansible/site.yml

- name: "[k8s-ansible] Install NFS client"
  tags: [k8s, nfs-client]
  import_playbook: k8s-ansible/install-nfs-client.yml

