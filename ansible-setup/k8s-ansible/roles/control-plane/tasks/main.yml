---
- name: Check if Kubernetes is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_initialized

- name: Initialize Kubernetes control plane
  command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --service-cidr={{ service_cidr }}
    --control-plane-endpoint={{ control_plane_endpoint }}
    --upload-certs
  when: not k8s_initialized.stat.exists
  register: kubeadm_init

- name: Create .kube directory for root
  file:
    path: /root/.kube
    state: directory
    mode: '0755'

- name: Copy admin.conf to root's kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    owner: root
    group: root
    mode: '0600'

- name: Create .kube directory for regular user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: ansible_user != 'root'

- name: Copy admin.conf to user's kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  when: ansible_user != 'root'

- name: Install Flannel CNI
  shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: 
    - cni_plugin == "flannel"
    - not k8s_initialized.stat.exists

- name: Wait for Flannel ConfigMap to be created
  shell: kubectl get cm -n kube-flannel kube-flannel-cfg
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_cm
  until: flannel_cm.rc == 0
  retries: 10
  delay: 5
  when: 
    - cni_plugin == "flannel"
    - not k8s_initialized.stat.exists

- name: Configure Flannel backend (host-gw for best performance)
  shell: |
    kubectl patch cm -n kube-flannel kube-flannel-cfg --type merge -p '
    {
      "data": {
        "net-conf.json": "{\"Network\": \"{{ pod_network_cidr }}\", \"Backend\": {\"Type\": \"{{ flannel_backend }}\"}}"
      }
    }'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: 
    - cni_plugin == "flannel"
    - not k8s_initialized.stat.exists

- name: Restart Flannel pods to apply host-gw configuration
  shell: kubectl delete pods -n kube-flannel --all
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: 
    - cni_plugin == "flannel"
    - not k8s_initialized.stat.exists

- name: Wait for Flannel pods to be created
  shell: kubectl get pods -n kube-flannel --no-headers 2>/dev/null | wc -l
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_pod_count
  until: flannel_pod_count.stdout|int > 0
  retries: 30
  delay: 5
  changed_when: false
  when: 
    - cni_plugin == "flannel"
    - not k8s_initialized.stat.exists

- name: Wait for Flannel pods to be ready with host-gw
  shell: kubectl wait --for=condition=Ready pods -n kube-flannel --all --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_ready
  retries: 3
  delay: 10
  until: flannel_ready.rc == 0
  when: 
    - cni_plugin == "flannel"
    - not k8s_initialized.stat.exists

- name: Install Calico CNI
  shell: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: 
    - cni_plugin == "calico"
    - not k8s_initialized.stat.exists

- name: Generate join command
  command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Save join command to file with shebang
  copy:
    content: |
      #!/bin/bash
      {{ join_command.stdout }}
    dest: /tmp/k8s_join_command.sh
    mode: '0755'

- name: Fetch join command to local machine
  fetch:
    src: /tmp/k8s_join_command.sh
    dest: /tmp/k8s_join_command.sh
    flat: yes

- name: Wait for all control plane pods to be ready
  shell: kubectl get pods -n kube-system --no-headers | grep -v Running | wc -l
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: not_running_pods
  until: not_running_pods.stdout == "0"
  retries: 30
  delay: 10
  changed_when: false
