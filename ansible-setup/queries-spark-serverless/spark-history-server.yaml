apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      serviceAccountName: spark
      containers:
        - name: history-server
          image: 10.158.1.10:32000/spark-s3a:3.5.1
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.history.HistoryServer
          env:
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=s3a://spark-logs/history
                -Dspark.hadoop.fs.s3a.endpoint=http://10.158.1.100:9000
                -Dspark.hadoop.fs.s3a.access.key=admin
                -Dspark.hadoop.fs.s3a.secret.key=lannion-enssat
                -Dspark.hadoop.fs.s3a.path.style.access=true
                -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
                -Dspark.hadoop.fs.s3a.connection.ssl.enabled=false
                -Dspark.history.ui.port=18080
                -Dspark.history.retainedApplications=100
                -Dspark.history.fs.cleaner.enabled=false
          ports:
            - containerPort: 18080
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: benchmark
spec:
  type: NodePort
  selector:
    app: spark-history-server
  ports:
    - port: 18080
      targetPort: 18080
      nodePort: 31808