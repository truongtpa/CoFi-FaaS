---
- name: Download Spark
  get_url:
    url: "{{ spark_download_url }}"
    dest: "/tmp/spark-{{ spark_version }}.tgz"
    timeout: 300

- name: Extract Spark archive
  unarchive:
    src: "/tmp/spark-{{ spark_version }}.tgz"
    dest: /opt/
    remote_src: yes

- name: Create symbolic link to Spark
  file:
    src: "/opt/spark-{{ spark_version }}-bin-hadoop{{ hadoop_version }}"
    dest: "{{ spark_home }}"
    state: link

- name: Set Spark environment variables
  template:
    src: spark-env.sh.j2
    dest: "{{ spark_home }}/conf/spark-env.sh"
    mode: '0755'

- name: Configure Spark defaults
  template:
    src: spark-defaults.conf.j2
    dest: "{{ spark_home }}/conf/spark-defaults.conf"
    mode: '0644'

- name: Configure workers file (master only)
  template:
    src: workers.j2
    dest: "{{ spark_home }}/conf/workers"
    mode: '0644'
  when: "'spark-master' in group_names"

- name: Add Spark to PATH
  lineinfile:
    path: /root/.bashrc
    line: "export PATH={{ spark_home }}/bin:{{ spark_home }}/sbin:$PATH"
    state: present

- name: Set SPARK_HOME environment variable
  lineinfile:
    path: /root/.bashrc
    line: "export SPARK_HOME={{ spark_home }}"
    state: present

- name: Create start script on master
  copy:
    dest: /root/start-cluster.sh
    mode: '0755'
    content: |
      #!/bin/bash
      cd {{ spark_home }}
      echo "Starting Spark Cluster..."
      sbin/start-all.sh
      sleep 3
      echo ""
      jps
      echo ""
      echo "Web UI: http://{{ spark_master_host }}:8080"
  when: "'spark-master' in group_names"

- name: Create stop script on master
  copy:
    dest: /root/stop-cluster.sh
    mode: '0755'
    content: |
      #!/bin/bash
      cd {{ spark_home }}
      echo "Stopping Spark Cluster..."
      sbin/stop-all.sh
      sleep 2
      jps
  when: "'spark-master' in group_names"