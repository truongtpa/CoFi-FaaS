---
- name: Start Spark Cluster
  hosts: spark-master
  become: yes

  tasks:
    - name: Start Spark cluster
      become_user: spark
      shell: |
        cd {{ spark_home }}
        sbin/start-all.sh
      register: start_output

    - name: Display output
      debug:
        var: start_output.stdout_lines

    - name: Wait for cluster to initialize
      pause:
        seconds: 5

    - name: Check processes
      become_user: spark
      shell: jps
      register: jps_output

    - name: Display running processes
      debug:
        var: jps_output.stdout_lines

    - name: Display Web UI
      debug:
        msg: "Spark Master Web UI: http://{{ spark_master_host }}:8080"